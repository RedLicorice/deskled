; DeskLED firmware for Tuya TYWE3L (ESP8266EX, 2MB flash, DOUT)

[env:tywe3l]
platform = espressif8266
board = esp12e
framework = arduino

; TYWE3L: 2MB flash, 512KB LittleFS, rest for sketch + OTA
board_build.flash_mode = dout
board_build.f_flash = 40000000L
board_upload.maximum_size = 1044464
board_build.ldscript = eagle.flash.2m512.ld
board_build.filesystem = littlefs

extra_scripts =
    pre:scripts/signing.py
    pre:scripts/embed_openapi.py

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder

; no DTR/RTS wiring: hold GPIO0 low + tap RST before upload
upload_port = /dev/ttyUSB0
upload_speed = 115200
upload_resetmethod = no_reset

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D FW_VERSION=\"1.5.0\"

; Wi-Fi update through the device's /update page (outbound HTTP only, works through host firewalls).
; Uploads the signed image; the device rejects unsigned ones.
;   DESKLED_PASSWORD=... pio run -e tywe3l_ota -t upload
[env:tywe3l_ota]
extends = env:tywe3l
upload_protocol = custom
upload_port = deskled-6d26.local
upload_command = curl --fail -sS --digest -u "admin:${sysenv.DESKLED_PASSWORD}" -F "firmware=@$BUILD_DIR/firmware.signed.bin" http://$UPLOAD_PORT/update
